name: Build iApp M3UI F-Droid Store and APK

on:
  push:
    branches: [ main, master, 'feature/**' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Grant Executable Permissions to Gradle Wrapper
        run: chmod +x gradlew

      - name: Build iApp Archive and Android APK
        run: |
          python3 build.py

      - name: Upload Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FDroid_M3_Store_Release_Artifacts
          path: |
            dist/FDroid_M3_Store.iapp
            dist/FDroid_M3_Store.apk
            dist/BUILD_SHA256.txt
