name: Build iApp M3UI F-Droid Store

on:
  push:
    branches: [ main, master, 'feature/**' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate Sources and Package iApp
        run: |
          python3 build.py

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FDroid_M3_Store_Release
          path: |
            dist/FDroid_M3_Store.iapp
            dist/BUILD_SHA256.txt
